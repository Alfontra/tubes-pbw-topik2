<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Recipe</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="btn-back" aria-label="Kembali">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M19 12H5M11 6l-6 6 6 6" />
      </svg>
    </a>
    <h1 class="topbar-title">Edit Recipe</h1>
  </header>

  <main class="page">
    <form class="recipe-form" action="#" method="post">

      <div class="form-grid">

        <div class="form-col form-col--left">

          <div class="form-group">
            <label for="judul">judul</label>
            <input type="text" id="judul" name="judul" required>
          </div>

          <div class="form-group">
            <select id="kategori" name="kategori" class="select-kategori" aria-label="Pilih kategori">
              <option value="" selected disabled>Pilih kategori</option>
              <option value="pedas">pedas</option>
              <option value="daging">daging</option>
              <option value="sayur">sayur</option>
              <option value="manis">manis</option>
            </select>

            <ul class="tag-list">
              <li class="tag">
                <span>pedas</span>
                <button type="button" class="tag-remove" aria-label="Hapus kategori pedas">&times;</button>
              </li>
              <li class="tag">
                <span>daging</span>
                <button type="button" class="tag-remove" aria-label="Hapus kategori daging">&times;</button>
              </li>
            </ul>
          </div>

          <div class="form-group">
            <label for="deskripsi">deskripsi</label>
            <textarea id="deskripsi" name="deskripsi" rows="3"></textarea>
          </div>
        </div>

        <div class="form-col form-col--right">
          <div class="form-group form-group--grow">
            <label for="instruksi">Instruksi</label>
            <textarea id="instruksi" name="instruksi" class="textarea-instruksi"></textarea>
          </div>
        </div>

      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-danger" aria-label="Hapus resep">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 3h6l1 2h4v2H4V5h4l1-2zM5 9h14l-1.2 11.1A2 2 0 0 1 15.8 22H8.2a2 2 0 0 1-2-1.9L5 9z" />
          </svg>
        </button>
        <button type="submit" class="btn btn-primary">Simpan</button>
      </div>

    </form>
  </main>

</body>
</html>
