<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="../static/css/User.css" th:href="@{/css/User.css}">
</head>
<body>
    <navbar class="navBarV2">
        <button class="back"  th:onclick="|location.href='@{/dashboardUser}'|">
            <img src="../static/images/akar-icons_arrow-left.png" th:src="@{/images/akar-icons_arrow-left.png}" alt="back" id="backIcon">
        </button>
        <h1 class="judul">Recipe Sharing</h1>
        
    </navbar>

    <main id="ContainerIsi">
        <div class="keteranganIsi">
            <img id="gambarDetailResep" th:src="${recipe.photo_path}" th:alt="${recipe.title}">

            <h2 id="judul-Resep" class="judulRecipe" th:text="${recipe.title}">Judul Recipe</h2>

            <div id="container-Kategori" class="containerKategori">
                <span class="kategoriResep" th:each="kat: ${recipe_categories.category_id}" th:text="${kat}"></span>
            </div>

            <p id="recipe-description" class="deskripsiRecipe" th:text="${recipe.description}">deskripsi recipe </p>
        </div>
        <div class="instruksiResep">
            <h2>Intruksi</h2>
            <p id="recipe-instruction" class="tahapanRecipe" th:text="${recipe.instructions}">tahapan resep</p>
        </div>
    </main>

</body>
</html>
